# Default values for free5gcUserPlane chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  projectName: free5gc
  userPlaneArchitecture: single # possible values are "single" and "ulcl"
  uesubnet: 10.1.0.0/16
  #Global network parametes
  n4network:
    enabled: true
    name: n4network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.240
    cidr: 29
    gatewayIP: 10.100.50.246
    excludeIP: 10.100.50.246
  n3network:
    enabled: true
    name: n3network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.232
    cidr: 29
    gatewayIP: 10.100.50.238
    excludeIP: 10.100.50.238
  n6network:
    enabled: true
    name: n6network
    type: ipvlan
    masterIf: wlan0
    subnetIP: 192.168.0.0 # Change this IP to your subnet
    cidr: 22
    gatewayIP: 192.168.0.1 # Change this IP to yours subnet gateway
    excludeIP: 192.168.0.1 # Change this IP to yours subnet gateway
  n9network:
    enabled: false
    name: n9network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.224
    cidr: 29
    gatewayIP: 10.100.50.230
    excludeIP: 10.100.50.230

upf:
  name: upf
  replicaCount: 1
  image:
    name: free5gc/upf
    tag: v4.2.0
    pullPolicy: Always
  configmap:
    wrapperAdditionalCommands: |
      # Remove non-N6 gateways
      ip route del default via 10.100.50.246 dev n4 || true
      ip route del default via 10.100.50.238 dev n3 || true
      ip route del default via 169.254.1.1 dev eth0 || true

      # Disable redirects (crucial for UE <-> UE communication)
      for i in /proc/sys/net/ipv4/conf/*/send_redirects; do echo 0 > $i; done

      # Disable reverse path filtering (crucial for UE <-> UE communication)
      for i in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 0 > $i; done

      # Enable hairpinning — FORWARD rules
      iptables -I FORWARD 1 -s 10.1.0.0/16 -d 10.1.0.0/16 -j ACCEPT
      iptables -A FORWARD -i n3 -o n3 -j ACCEPT

      # FIX: Insert UE-to-UE NAT bypass BEFORE any masquerade rule
      iptables -t nat -I POSTROUTING 1 -s 10.1.0.0/16 -d 10.1.0.0/16 -j ACCEPT

      # FIX: Add higher-priority policy route so UE->UE stays in main table
      # (main table has upfgtp routes, n6if table only has default via n6)
      ip rule add from 10.1.0.0/16 to 10.1.0.0/16 table main priority 100

      # Ensure UE can reach the internet (lower priority, only for non-UE destinations)
      echo "nameserver 8.8.8.8" > /etc/resolv.conf
      echo "nameserver 194.29.160.10" >> /etc/resolv.conf

      # apt install -y tcpdump
      # Note: remove the duplicate MASQUERADE below — it's already in wrapper.sh base
      # iptables -t nat -A POSTROUTING -o n6 -j MASQUERADE  ← DELETE THIS LINE
    # wrapperAdditionalCommands: |
    #   echo "123" > /tmp/123
  volume:
    mount: /free5gc/config/
    tlsmount: /free5gc/config/TLS

  # network paramters
  n3if: # GTP-U
    ipAddress: 10.100.50.233
  n4if: # PFCP
    ipAddress: 10.100.50.241
  n6if: # DN
    ipAddress: 192.168.0.100 # Change this IP address to your Hotspot IP space

  podAnnotations: {}
    # additional annotations
  imagePullSecrets: []
  podSecurityContext:
    sysctls:
      - name: net.ipv4.ip_forward
        value: "1" # enable ip forwarding
  securityContext:
    privileged: true
    capabilities:
      add: ["NET_ADMIN", "NET_RAW"]
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 40
    successThreshold: 1
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  nodeSelector:
    free5gc-role: rpi-upf
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  configuration:
    dnnList: # The DNN list supported by UPF
      - dnn: internet # Data Network Name
        cidr: 10.1.0.0/17 # Classless Inter-Domain Routing for assigned IPv4 pool of UE
        # natifname: n6
      - dnn: internet # Data Network Name
        cidr: 10.1.128.0/17 # Classless Inter-Domain Routing for assigned IPv4 pool of UE
        # natifname: n6

    logger: # log output setting
      enable: true # true or false
      level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
      reportCaller: false # enable the caller report or not, value: true or false
