# Default values for free5gc-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: free5gc
  userPlaneArchitecture: single # possible values are "single" and "ulcl"
  nrf:
    service:
      name: nrf-nnrf
      type: ClusterIP
      port: "8000"
      nodePort: "30800"
  sbi:
    scheme: http
  amf:
    n2if: # NGAP
      ipAddress: 10.100.50.249
    service:
      ngap:
        enabled: false
        name: amf-n2
        port: 38412
        nodeport: 31412
        protocol: SCTP
        type: NodePort
  smf:
    n4if:
      ipAddress: 10.100.50.244
    configuration:
      userplane_information:
        upfs:
          # Give your standalone UPF a name here
          vUPF:
            nodeID: 10.100.50.241  # This MUST match your standalone UPF's n4if IP
            type: UPF
            interfaces:
              - interfaceType: N3
                endpoints:
                  - 10.100.50.233  # This MUST match your standalone UPF's n3if IP
                networkInstance: internet
              - interfaceType: N6
                endpoints:
                  - 192.168.0.100  # This MUST match your standalone UPF's n6if IP
                networkInstance: internet

  #Global network parametes
  n2network:
    enabled: true
    name: n2network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.248
    cidr: 29
    gatewayIP: 10.100.50.254
    excludeIP: 10.100.50.254
  n3network:
    enabled: true
    name: n3network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.232
    cidr: 29
    gatewayIP: 10.100.50.238
    excludeIP: 10.100.50.238
  n4network:
    enabled: true
    name: n4network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.240
    cidr: 29
    gatewayIP: 10.100.50.246
    excludeIP: 10.100.50.246
  n6network:
    enabled: true
    name: n6network
    type: ipvlan
    masterIf: wlan0
    subnetIP: 10.0.2.0
    cidr: 24
    gatewayIP: 10.0.2.2
    excludeIP: 10.0.2.2
  n9network:
    enabled: false
    name: n9network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.224
    cidr: 29
    gatewayIP: 10.100.50.230
    excludeIP: 10.100.50.230

# These parameters can be used to enable/disable deployment of subcharts
deployMongoDb: true
deployAmf: true
deployAusf: true
deployChf: true
deployN3iwf: false
deployNef: true
deployNrf: true
deployNssf: true
deployPcf: true
deploySmf: true
deployUdm: true
deployUdr: true
deployUpf: false
deployWebui: true
deployDbPython: false

# Disable the deployment of mongodb as an NRF subchart
free5gc-nrf:
  db:
    enabled: false

# This section can be used to override the default values in the MongoDB chart
mongodb:
  # Since there are no legacy Bitnami tags for ARM architecture, we need to do this
  image:
    repository: mongo
    tag: 4.4.18
    pullPolicy: IfNotPresent

  # Ugly, but it is the only solution...
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false
  customReadinessProbe: {}
  customLivenessProbe: {}
  
  nodeSelector:
    free5gc-role: rpi-cp

  fullnameOverride: "mongodb"
  useStatefulSet: true
  auth:
    enabled: false
  persistence:
    size: 6Gi
    mountPath: /data/db/
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
    nodePort: "30017"
